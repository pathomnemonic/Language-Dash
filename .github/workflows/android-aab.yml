name: Android AAB (Play upload copy)

# Builds the same release bundle as the Codemagic android-release workflow, but leaves it
# UNSIGNED and stores it as a workflow artifact. Orion downloads the artifact, signs it with
# the app upload key (jarsigner, same as the Codemagic step), and uploads it to Play Console.
# Exists because Codemagic build artifacts cannot be handed to the Play Console browser flow.
# Manual trigger only. Added by Orion, Nov 25, 2026.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web game
        env:
          VITE_SUPABASE_URL: https://reflaqmcwynrxclunkck.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_3k9K-AWsR3mARofiKqx0Ig_4TwvvbU-
          VITE_SUPPORT_EMAIL: patho.mnemonic1@gmail.com
          VITE_APPSTORE_ID: "6839357219"
          VITE_BASE_PATH: /
        run: |
          npm ci
          npx vite build
      - name: Sync the Android project
        run: npx cap sync android
      - name: Set the version code
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Build the Android app bundle (unsigned)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
